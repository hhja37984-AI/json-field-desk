<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Desk</title>
<style>
:root{color-scheme:light;--bg:#f7f7f4;--paper:#fff;--line:#deded8;--ink:#252725;--dim:#727670;--accent:#416a61;--soft:#eaf1ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:6px;padding:8px 11px}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}.primary{background:var(--accent);border-color:var(--accent);color:white}.app{max-width:1500px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}h1{font-size:19px;letter-spacing:-.5px;margin:0 15px 0 0}.muted{color:var(--dim)}.spacer{flex:1}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;margin-top:14px}.panel{border:1px solid var(--line);background:var(--paper);border-radius:8px;overflow:hidden}.panelHead{padding:12px;border-bottom:1px solid var(--line)}.panelHead strong{font-size:13px}.fieldDisclosure>summary{display:flex;align-items:center;gap:5px;cursor:pointer;list-style:none;user-select:none}.fieldDisclosure>summary::-webkit-details-marker{display:none}.fieldDisclosure>summary .chevron{margin-left:auto;width:8px;height:8px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);transition:transform .15s}.fieldDisclosure:not([open])>summary{border-bottom:0}.fieldDisclosure:not([open]) .chevron{transform:rotate(-45deg)}.fields{max-height:calc(100vh - 220px);overflow:auto;padding:8px}.field{display:flex;align-items:flex-start;gap:7px;padding:6px 5px;word-break:break-word}.field input{margin:3px 0 0;accent-color:var(--accent)}.field small{display:block;color:var(--dim)}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}input[type="search"],select{background:white;border:1px solid var(--line);padding:8px;border-radius:5px;min-width:0}input[type="search"]{flex:1;min-width:150px}.items{padding:10px;max-height:calc(100vh - 220px);overflow:auto}.item{border:1px solid var(--line);border-radius:7px;margin-bottom:10px;background:#fff}.itemHeader{padding:9px 11px;background:#fafbf9;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}.itemHeader .title{font-weight:650;overflow-wrap:anywhere}.itemHeader small{color:var(--dim)}.itemContent{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:10px;padding:11px}.editor label{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:650;margin-bottom:5px;color:var(--dim);overflow-wrap:anywhere}.editor textarea,.editor input[type="text"],.editor input[type="number"]{width:100%;border:1px solid var(--line);border-radius:5px;background:#fff;padding:9px;line-height:1.5;color:var(--ink)}.editor textarea{resize:none;min-height:42px;overflow-y:hidden}.editor textarea:focus,.editor input:focus{outline:2px solid #cde3d8;border-color:var(--accent)}.editor .boolean{display:flex;align-items:center;gap:7px;padding:8px 0}.pill{display:inline-block;border:1px solid var(--line);border-radius:4px;color:var(--dim);font-size:11px;padding:1px 5px}.empty{padding:40px 16px;text-align:center;color:var(--dim)}#notice{font-size:12px;color:var(--dim)}.error{color:#a13232!important}.dirty{color:#986223!important}.hide{display:none!important}.drop{outline:2px dashed var(--accent);outline-offset:-5px}.hint{font-size:12px;color:var(--dim);padding:9px 12px;border-top:1px solid var(--line)}@media(max-width:690px){.app{padding:9px}.layout{grid-template-columns:1fr}.fields{max-height:180px}.items{max-height:none}.top{gap:7px}.spacer{display:none}.itemContent{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="top"><h1>Field Desk</h1><button id="open">JSON 열기</button><input id="file" type="file" accept=".json,application/json" hidden><button id="save" class="primary" disabled>JSON 저장</button><button id="reset" disabled>수정 취소</button><span class="spacer"></span><span id="notice">파일을 선택하거나 이 화면에 끌어다 놓으세요.</span></header>
<div class="layout"><aside class="panel"><details class="fieldDisclosure" open><summary class="panelHead"><strong>표시할 필드</strong> <span class="muted" id="fieldCount"></span><span class="chevron" aria-hidden="true"></span></summary><div class="tools"><input type="search" id="fieldSearch" placeholder="필드 검색" aria-label="필드 검색"><button id="all" title="전체 선택">전체</button><button id="none" title="선택 해제">해제</button></div><div id="fields" class="fields"><div class="empty">JSON 파일을 열어주세요.</div></div><div class="hint">선택한 필드만 표시됩니다. 원본 키와 구조는 그대로 유지됩니다.</div></details></aside>
<section class="panel"><div class="tools"><input type="search" id="search" placeholder="표시 중인 값에서 검색" aria-label="내용 검색"><select id="pageSize" aria-label="페이지당 항목"><option value="25">25개씩</option><option value="50">50개씩</option><option value="100">100개씩</option></select><button id="prev">이전</button><span id="pageInfo" class="muted">0 / 0</span><button id="next">다음</button></div><div id="items" class="items"><div class="empty">필드를 골라 내용을 확인하고 수정할 수 있습니다.</div></div><div class="hint" id="summary">파일은 서버로 전송되지 않습니다. 저장하면 수정된 JSON 파일이 다운로드됩니다.</div></section></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), isObj=v=>v!==null&&typeof v==='object', own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
let root=null,original='',filename='data.json',rows=[],paths=[],selected=new Set(),page=0,dirty=false,parseError='',parseWarnings=new Map();
const pathKey=p=>JSON.stringify(p), showPath=p=>p.length?p.map((x,i)=>typeof x==='number'?`[${x}]`:(i?'.':'')+String(x)).join(''):'(root)', keyStr=p=>p.length?showPath(p):'(root)';
function setNotice(msg,cls=''){$('notice').textContent=msg;$('notice').className=cls}
function getAt(obj,p){let v=obj;for(const k of p){if(v==null||!own(v,k))return undefined;v=v[k]}return v}
function setAt(obj,p,value){if(!p.length){root=value;return}let cur=obj;for(let i=0;i<p.length-1;i++)cur=cur[p[i]];cur[p[p.length-1]]=value}
function scan(){rows=[];const found=new Map();const add=p=>found.set(pathKey(p),p);
 // Each array of objects is a record collection. Nested object properties are exposed using relative paths.
 const collections=[];const seen=new WeakSet();
 function traverse(v,p,depth){if(depth>16||!isObj(v)||seen.has(v))return;seen.add(v);
 if(Array.isArray(v)){if(v.length&&v.some(x=>isObj(x)&&!Array.isArray(x))){collections.push({p,values:v});return}for(let i=0;i<Math.min(v.length,15);i++)traverse(v[i],p.concat(i),depth+1);return}
 for(const [k,child] of Object.entries(v))traverse(child,p.concat(k),depth+1)}
 traverse(root,[],0);
 let chosen=collections.find(c=>c.p.length===0)||collections.sort((a,b)=>b.values.length-a.values.length)[0];
 if(chosen){rows=chosen.values.map((obj,index)=>({base:chosen.p.concat(index),value:obj}));const sample=rows.slice(0,250);
 function collect(v,p,d){if(d>7)return;if(!isObj(v)||v===null){add(p);return}if(Array.isArray(v)){add(p);return}if(!Object.keys(v).length){add(p);return}for(const [k,ch] of Object.entries(v))collect(ch,p.concat(k),d+1)}
 for(const r of sample)if(isObj(r.value)&&!Array.isArray(r.value))collect(r.value,[],0);else add([]);
 }else{rows=[{base:[],value:root}];function collect(v,p,d){if(d>7||!isObj(v)||Array.isArray(v)){add(p);return}if(!Object.keys(v).length){add(p);return}for(const [k,ch]of Object.entries(v))collect(ch,p.concat(k),d+1)}collect(root,[],0)}
 paths=[...found.values()].sort((a,b)=>showPath(a).localeCompare(showPath(b)));selected=new Set(paths.slice(0,Math.min(4,paths.length)).map(pathKey));page=0;
 }
 function renderFields(){const q=$('fieldSearch').value.toLowerCase();$('fields').replaceChildren();const fragment=document.createDocumentFragment();for(const p of paths){const labelText=keyStr(p);if(!labelText.toLowerCase().includes(q))continue;const div=document.createElement('label');div.className='field';const input=document.createElement('input');input.type='checkbox';input.checked=selected.has(pathKey(p));input.addEventListener('change',()=>{input.checked?selected.add(pathKey(p)):selected.delete(pathKey(p));page=0;renderFields();renderItems()});const txt=document.createElement('span');txt.textContent=labelText;div.append(input,txt);fragment.append(div)}$('fields').append(fragment);$('fieldCount').textContent=`${selected.size}/${paths.length}`}
 const selectedPaths=()=>[...selected].map(k=>paths.find(p=>pathKey(p)===k)).filter(Boolean);
 function textVal(v){return typeof v==='string'?v:JSON.stringify(v,null,2)??''}
 function matches(r,q,sp){if(!q)return true;return sp.some(p=>textVal(getAt(r.value,p)).toLowerCase().includes(q))}
 function autoSizeTextarea(inp){inp.style.height='auto';inp.style.height=inp.scrollHeight+'px'}
 function renderItems(){const sp=selectedPaths(),q=$('search').value.trim().toLowerCase(),filtered=rows.map((r,i)=>({r,i})).filter(({r})=>matches(r,q,sp));const limit=Number($('pageSize').value);const total=Math.max(1,Math.ceil(filtered.length/limit));page=Math.max(0,Math.min(page,total-1));$('pageInfo').textContent=`${page+1} / ${total}`;$('prev').disabled=page===0;$('next').disabled=page>=total-1;$('items').replaceChildren();$('fieldCount').textContent=`${selected.size}/${paths.length}`;$('summary').textContent=`${filtered.length}개 항목 · ${selected.size}개 필드 표시 · ${dirty?'저장되지 않은 변경 사항 있음':'변경 사항 없음'}`;
 if(!root||!sp.length||!filtered.length){const el=document.createElement('div');el.className='empty';el.textContent=!root?'JSON 파일을 열어주세요.':!sp.length?'왼쪽에서 표시할 필드를 선택하세요.':'검색 결과가 없습니다.';$('items').append(el);return}
 const fragment=document.createDocumentFragment();for(const {r,i} of filtered.slice(page*limit,(page+1)*limit)){const item=document.createElement('article');item.className='item';const head=document.createElement('div');head.className='itemHeader';const title=document.createElement('span');title.className='title';title.textContent=`#${i+1}`;const desc=document.createElement('small');desc.textContent=showPath(r.base);head.append(title,desc);item.append(head);const content=document.createElement('div');content.className='itemContent';
 for(const p of sp){const v=getAt(r.value,p),wrap=document.createElement('div');wrap.className='editor';const label=document.createElement('label');label.textContent=keyStr(p);const tag=document.createElement('span');tag.className='pill';tag.textContent=v===undefined?'missing':v===null?'null':Array.isArray(v)?'array':typeof v;label.append(tag);wrap.append(label);
 if(v===undefined){const msg=document.createElement('small');msg.className='muted';msg.textContent='이 항목에는 해당 필드가 없습니다.';wrap.append(msg)}else if(typeof v==='boolean'){const inp=document.createElement('input');inp.type='checkbox';inp.checked=v;const holder=document.createElement('label');holder.className='boolean';holder.append(inp,document.createTextNode('true / false'));inp.addEventListener('change',()=>commit(r,p,inp.checked));wrap.append(holder)}else{const inp=document.createElement('textarea');inp.rows=1;inp.value=textVal(v);inp.addEventListener('input',()=>autoSizeTextarea(inp));inp.spellcheck=false;inp.setAttribute('aria-label',keyStr(p));if(typeof v==='string')inp.addEventListener('input',()=>commit(r,p,inp.value));else{inp.addEventListener('change',()=>{try{const parsed=JSON.parse(inp.value);if(v===null||Array.isArray(v)||typeof parsed===typeof v){commit(r,p,parsed);inp.style.borderColor='';parseWarnings.delete(inp)}else throw Error('기존 값과 자료형이 다릅니다.')}catch(e){inp.style.borderColor='#b64545';parseWarnings.set(inp,e.message);setNotice('JSON 문법 또는 자료형 오류: '+e.message,'error');updateButtons()}})}wrap.append(inp)}content.append(wrap)}item.append(content);fragment.append(item)}$('items').append(fragment);$('items').querySelectorAll('textarea').forEach(autoSizeTextarea)}
 function commit(r,p,v){const full=r.base.concat(p);setAt(root,full,v);if(!p.length)r.value=v;dirty=true;setNotice('수정 사항이 있습니다.','dirty');updateButtons();$('summary').textContent=`${rows.length}개 항목 · ${selected.size}개 필드 표시 · 저장되지 않은 변경 사항 있음`}
 function updateButtons(){$('save').disabled=root===null||parseWarnings.size>0;$('reset').disabled=root===null||!dirty}
 function loadText(content,name){let parsed;try{parsed=JSON.parse(content)}catch(e){setNotice('JSON 파싱 오류: '+e.message,'error');return}root=parsed;original=content;filename=name||'data.json';dirty=false;parseWarnings.clear();scan();$('fieldSearch').value='';$('search').value='';renderFields();renderItems();setNotice(filename+' · 파일 열림');updateButtons()}
 $('open').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files?.[0];if(file)loadText(await file.text(),file.name);e.target.value=''};
 $('save').onclick=()=>{if(parseWarnings.size)return;const blob=new Blob([JSON.stringify(root,null,2)+'\n'],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename.replace(/\.json$/i,'')+'_edited.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);dirty=false;original=JSON.stringify(root);setNotice('수정된 JSON 파일을 저장했습니다.');renderItems();updateButtons()};
 $('reset').onclick=()=>{if(!confirm('저장하지 않은 수정 사항을 모두 취소할까요?'))return;loadText(original,filename)};
 $('all').onclick=()=>{selected=new Set(paths.map(pathKey));page=0;renderFields();renderItems()};$('none').onclick=()=>{selected.clear();page=0;renderFields();renderItems()};$('fieldSearch').oninput=renderFields;$('search').oninput=()=>{page=0;renderItems()};$('pageSize').onchange=()=>{page=0;renderItems()};$('prev').onclick=()=>{page--;renderItems()};$('next').onclick=()=>{page++;renderItems()};
 document.addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drop')});document.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drop')});document.addEventListener('drop',async e=>{e.preventDefault();document.body.classList.remove('drop');const f=e.dataTransfer.files?.[0];if(f)loadText(await f.text(),f.name)});
 window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
})();
</script></body></html>
